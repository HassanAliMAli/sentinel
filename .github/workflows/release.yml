name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore app/sentinel-release.keystore -alias sentinel_alias -keyalg RSA -keysize 2048 -validity 10000 -storepass sentinel123 -keypass sentinel123 -dname "CN=Sentinel User, OU=Sentinel, O=Sentinel Open Source, L=Unknown, ST=Unknown, C=Unknown"
        
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.2

      - name: Build with Gradle
        run: gradle assembleRelease
        env:
          KEYSTORE_PASSWORD: sentinel123
          KEY_PASSWORD: sentinel123
          KEY_ALIAS: sentinel_alias
          KEYSTORE_FILE: sentinel-release.keystore

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/*-release.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
